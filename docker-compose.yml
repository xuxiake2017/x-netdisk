version: "2.4"
networks:
  netdisk:
volumes:
  tracker_data:
  storage_data:
  mysql_data:
x-app-environment: &app-environment
  DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/netdisk?useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8}
  DB_USERNAME: ${DB_USERNAME:-root}
  DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中配置 DB_PASSWORD}
  REDIS_DATABASE: ${REDIS_DATABASE:-0}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  ZOOKEEPER_SERVERS: ${ZOOKEEPER_SERVERS:-zookeeper:2181}
  ZOOKEEPER_CONNECT_TIMEOUT: ${ZOOKEEPER_CONNECT_TIMEOUT:-15000}
  ZOOKEEPER_SESSION_TIMEOUT: ${ZOOKEEPER_SESSION_TIMEOUT:-30000}
  FASTDFS_TRACKER: ${FASTDFS_TRACKER:-fastdfs_tracker:22122}
x-web-environment: &web-environment
  <<: *app-environment
  WEB_SERVER_PORT: ${WEB_SERVER_PORT:-8080}
  PUBLIC_SERVER_HOST: ${PUBLIC_SERVER_HOST:-http://127.0.0.1:8181}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  FASTDFS_NGINX_SERVER: ${FASTDFS_NGINX_SERVER:-http://192.168.81.30:8888}
  LIBREOFFICE_HOME: ${LIBREOFFICE_HOME:-/usr/lib/libreoffice}
  LIBREOFFICE_PORTS: ${LIBREOFFICE_PORTS:-2002, 2003, 2004}
  USER_TOTAL_MEMORY: ${USER_TOTAL_MEMORY:-104857600}
  FILE_SIZE_MAX: ${FILE_SIZE_MAX:-52428800}
  VIP_FILE_SIZE_MAX: ${VIP_FILE_SIZE_MAX:-524288000}
  MULTIPART_MAX_FILE_SIZE: ${MULTIPART_MAX_FILE_SIZE:-500MB}
  MULTIPART_MAX_REQUEST_SIZE: ${MULTIPART_MAX_REQUEST_SIZE:-1024MB}
  RECYCLE_DELAY_TIME: ${RECYCLE_DELAY_TIME:-3600000}
  MEDIA_CORE_POOL_SIZE: ${MEDIA_CORE_POOL_SIZE:-2}
  MEDIA_MAX_POOL_SIZE: ${MEDIA_MAX_POOL_SIZE:-4}
  MEDIA_QUEUE_CAPACITY: ${MEDIA_QUEUE_CAPACITY:-20}
  EMAIL_ACCOUNT: ${EMAIL_ACCOUNT:-xxx}
  EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
  EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-smtp.aliyun.com}
  EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
  EMAIL_VERIFY_EXPIRE: ${EMAIL_VERIFY_EXPIRE:-86400000}
  SMS_ACCESS_KEY_ID: ${SMS_ACCESS_KEY_ID:-}
  SMS_ACCESS_KEY_SECRET: ${SMS_ACCESS_KEY_SECRET:-}
  SMS_MNS_ENABLED: ${SMS_MNS_ENABLED:-false}
  SMS_SIGN_NAME: ${SMS_SIGN_NAME:-xxx}
  SMS_TEMPLATE_CODE: ${SMS_TEMPLATE_CODE:-xxx}
  SMS_TEMPLATE_CONTENT: ${SMS_TEMPLATE_CONTENT:-xxx}
  SMS_QUEUE_NAME: ${SMS_QUEUE_NAME:-xxx}
  SMS_VERIFY_EXPIRE: ${SMS_VERIFY_EXPIRE:-300000}
  SMS_SEND_INTERVAL: ${SMS_SEND_INTERVAL:-60000}
  TULING_API_KEY: ${TULING_API_KEY:-}
  TULING_API_URL: ${TULING_API_URL:-http://openapi.tuling123.com/openapi/api/v2}
  WECHAT_APP_ID: ${WECHAT_APP_ID:-xxx}
  WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
services:
  redis:
    image: "redis:4.0.9"
    ports:
      - 6379:6379
    volumes:
      - ./conf/redis.conf:/usr/local/etc/redis/redis.conf
    restart: "always"
    networks:
      - netdisk
  zookeeper:
    image: "zookeeper:3.4.14"
    ports:
      - 2181:2181
    restart: "always"
    healthcheck:
      test: ["CMD-SHELL", "zkServer.sh status"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - netdisk
  mysql:
    image: mysql:5.7.29
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中配置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-netdisk}
      MYSQL_USER: ${MYSQL_USER:-xuxiake}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中配置 MYSQL_PASSWORD}
    volumes:
      - ./conf:/etc/mysql/conf.d
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./sql:/opt/sql
      - mysql_data:/var/lib/mysql
    networks:
      - netdisk
  fastdfs_tracker:
    image: delron/fastdfs
    volumes:
      - tracker_data:/var/fdfs
    command: tracker
    restart: "always"
    networks:
      - netdisk
    ports:
      - 22122:22122
  fastdfs_storage:
    image: delron/fastdfs
    environment:
      - TRACKER_SERVER=fastdfs_tracker:22122
    volumes:
      - storage_data:/var/fdfs
    command: storage
    restart: "always"
    depends_on:
      - fastdfs_tracker
    networks:
      - netdisk
    ports:
      - 23000:23000
      - 8888:8888
  web:
    build: ./x-netdisk-web
    environment:
      <<: *web-environment
    volumes:
      - ./logs:/logs
    ports:
      - ${WEB_SERVER_PORT:-8080}:${WEB_SERVER_PORT:-8080}
    restart: "always"
    networks:
      - netdisk
    depends_on:
      redis:
        condition: service_started
      zookeeper:
        condition: service_healthy
      mysql:
        condition: service_started
      fastdfs_tracker:
        condition: service_started
      fastdfs_storage:
        condition: service_started
  route:
    build: ./x-netdisk-route
    environment:
      <<: *app-environment
      ROUTE_HOSTNAME: ${ROUTE_HOSTNAME:-route}
      ROUTE_SERVER_PORT: ${ROUTE_SERVER_PORT:-9000}
    volumes:
      - ./logs:/logs
    ports:
      - ${ROUTE_SERVER_PORT:-9000}:${ROUTE_SERVER_PORT:-9000}
    restart: "always"
    networks:
      - netdisk
    depends_on:
      redis:
        condition: service_started
      zookeeper:
        condition: service_healthy
  quartz:
    build: ./x-netdisk-quartz
    environment:
      <<: *app-environment
      QUARTZ_HOSTNAME: ${QUARTZ_HOSTNAME:-quartz}
      QUARTZ_SERVER_PORT: ${QUARTZ_SERVER_PORT:-8200}
    volumes:
      - ./logs:/logs
    ports:
      - ${QUARTZ_SERVER_PORT:-8200}:${QUARTZ_SERVER_PORT:-8200}
    restart: "always"
    networks:
      - netdisk
    depends_on:
      redis:
        condition: service_started
      zookeeper:
        condition: service_healthy
      mysql:
        condition: service_started
      fastdfs_tracker:
        condition: service_started
      fastdfs_storage:
        condition: service_started
  chat-server:
    build: ./x-netdisk-chat-server
    environment:
      <<: *app-environment
      CHAT_SERVER_HOSTNAME: ${CHAT_SERVER_HOSTNAME:-chat-server}
      CHAT_SERVER_PORT: ${CHAT_SERVER_PORT:-8100}
      CHAT_SOCKET_PORT: ${CHAT_SOCKET_PORT:-9527}
      CHAT_SOCKET_IP: ${CHAT_SOCKET_IP:-localhost}
    volumes:
      - ./logs:/logs
    ports:
      - ${CHAT_SERVER_PORT:-8100}:${CHAT_SERVER_PORT:-8100}
      - ${CHAT_SOCKET_PORT:-9527}:${CHAT_SOCKET_PORT:-9527}
    restart: "always"
    networks:
      - netdisk
    depends_on:
      redis:
        condition: service_started
      zookeeper:
        condition: service_healthy
      mysql:
        condition: service_started
  admin:
    build: ./x-netdisk-admin
    environment:
      <<: *app-environment
      ADMIN_SERVER_PORT: ${ADMIN_SERVER_PORT:-8300}
      TOKEN_SECRET: ${TOKEN_SECRET:?请在 .env 中配置 TOKEN_SECRET}
    volumes:
      - ./logs:/logs
    ports:
      - ${ADMIN_SERVER_PORT:-8300}:${ADMIN_SERVER_PORT:-8300}
    restart: "always"
    networks:
      - netdisk
    depends_on:
      - redis
      - mysql
