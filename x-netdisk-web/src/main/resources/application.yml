server:
  port: ${WEB_SERVER_PORT:8080}
  servlet:
    context-path: /netdisk
application:
  # 验证码
  captcha:
    # 存redis前缀
    prefix: 'CAPTCHA:'
    # 超时时间5分钟
    timeout: 300000
  zookeeper:
    zkServer: ${ZOOKEEPER_SERVERS:zookeeper:2181}
    connectTimeout: ${ZOOKEEPER_CONNECT_TIMEOUT:15000}
    sessionTimeout: ${ZOOKEEPER_SESSION_TIMEOUT:30000}
    routeRoot: /routeRoot
    # 负载均衡算法
    IBLA: group.xuxiake.common.zookeeper.balancer.RandomBalancer
  route:
    getChatServerPath: /route/getChatServer
    findRouteByUserPath: /route/findRouteByUser
    sendMsgToUserPath: /route/sendMsgToUser
    quartz:
      delFilePath: /route/delFile
      delJobPath: /route/delJob
  media:
    corePoolSize: ${MEDIA_CORE_POOL_SIZE:2}
    maxPoolSize: ${MEDIA_MAX_POOL_SIZE:4}
    queueCapacity: ${MEDIA_QUEUE_CAPACITY:20}
  security:
    sessionCookieSecure: ${SESSION_COOKIE_SECURE:false}
spring:
  datasource:
    name: db
    url: ${DB_URL:jdbc:mysql://mysql:3306/netdisk?useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

    # 使用druid数据源
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      filters: stat
      max-active: 20
      initial-size: 1
      max-wait: 60000
      min-idle: 1
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 30000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-open-prepared-statements: 20
      async-init: true
      validation-query: select 1
  # redis
  redis:
    database: ${REDIS_DATABASE:0}
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
  # 文件上传大小
  servlet:
    multipart:
      # 容器层限制不能低于业务层 VIP 单文件上限，否则请求到不了 FileService。
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:500MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:1024MB}
  shiro:
    sessionManager:
      # 设置session超时时间半天，默认半小时
      globalSessionTimeout: 43200000
  # 配置jackson 时间返回格式
  jackson:
    serialization:
      write-dates-as-timestamps: true
    time-zone: GMT+8
mybatis:
  mapper-locations: classpath:mapper/**/*.xml  #注意：一定要对应mapper映射xml文件的所在路径
  type-aliases-package: group.xuxiake.common.entity  # 注意：对应实体类的路径
  configuration:
    call-setters-on-nulls: true
fdfs:
  so-timeout: 1501
  connect-timeout: 601
  # 缩略图生成参数
  thumb-image:
    width: 150
    height: 150
  #TrackerList参数,支持多个
  tracker-list:
    ${FASTDFS_TRACKER:fastdfs_tracker:22122}
  fdfs-nginx-server: ${FASTDFS_NGINX_SERVER:http://192.168.81.30:8888}
logging:
  level:
    root: INFO
jodconverter:
  local:
    # 设置LibreOffice主目录
    officeHome: ${LIBREOFFICE_HOME:/usr/lib/libreoffice}
    # 开启多个LibreOffice进程，每个端口对应一个进程
    portNumbers: ${LIBREOFFICE_PORTS:2002, 2003, 2004}
