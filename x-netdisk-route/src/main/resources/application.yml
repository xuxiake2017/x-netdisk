application:
  zookeeper:
    zkServer: ${ZOOKEEPER_SERVERS:zookeeper:2181}
    connectTimeout: ${ZOOKEEPER_CONNECT_TIMEOUT:15000}
    sessionTimeout: ${ZOOKEEPER_SESSION_TIMEOUT:30000}
    chatRoot: /chatRoot
    routeRoot: /routeRoot
    quartzRoot: /quartzRoot
    # 负载均衡算法
    IBLA: group.xuxiake.common.zookeeper.balancer.RandomBalancer
    hostname: ${ROUTE_HOSTNAME:route}
  route:
    chat:
      chatRoutePrefix: 'CHAT_ROUTE:'
      sendMsgPath: /chat-server/sendMsg
    quartz:
      delFilePath: /quartz/delFile
      delJobPath: /quartz/delJob

spring:
  redis:
    database: ${REDIS_DATABASE:0}
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
server:
  port: ${ROUTE_SERVER_PORT:9000}
  servlet:
    context-path: /route
logging:
  level:
    root: INFO
